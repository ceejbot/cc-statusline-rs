---
name: "test"
on:
    push:
        branches: [ "main" ]
        paths:
        - src/**
        - Cargo.toml
        - Cargo.lock
        - .github/workflows/test.yml
    pull_request:
        branches: [ "main" ]
    workflow_dispatch:
permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    test:
        name: test
        runs-on: ubuntu-latest
        steps:
        - name: checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - name: get stable Rust
          uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17
          with:
            toolchain: stable
            cache-directories: |
                ~/.cargo/registry
                ~/.cargo/bin
                target

        # pinned to a specific nextest version; bump deliberately
        - name: get cargo-nextest on path
          run: |
            curl -sL https://get.nexte.st/0.9.143/linux -o nextest.tgz
            tar xfz nextest.tgz
            mv cargo-nextest /home/runner/.cargo/bin

        - name: run the tests
          run: cargo nextest run

    # Windows binaries ship in releases, so the suite runs there too. Plain
    # cargo test: the nextest bootstrap above is linux-only.
    test-windows:
        name: test (windows)
        runs-on: windows-latest
        steps:
        - name: checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - name: get stable Rust
          uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17
          with:
            toolchain: stable

        - name: run the tests
          run: cargo test

    clippy:
        name: clippy
        runs-on: ubuntu-latest
        steps:
        - name: checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - name: get stable Rust
          uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17
          with:
            toolchain: stable
            components: clippy

        - name: consult Clippy
          run: cargo clippy --all-targets -- -D warnings

    fmt:
        name: formatting check
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: sccache-cache
              uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

            - name: Install nightly Rust
              uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17
              with:
                  toolchain: nightly
                  components: rustfmt

            - name: check formatting
              run: cargo +nightly fmt --check --all
